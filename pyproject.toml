[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-link"
version = "1.0.0"
description = "Zero-shot context engine — fuses EGC session memory with GrapeRoot semantic graphs for AI coding assistants."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ai", "context", "llm", "developer-tools", "graperoot", "egc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# graperoot pulls in mcp, pydantic, uvicorn, starlette etc. automatically
dependencies = [
    "graperoot",
]

[project.scripts]
link = "thelink.cli:main"

[project.urls]
Repository = "https://github.com/your-org/the-link"

[tool.setuptools.packages.find]
where = ["."]
include = ["thelink*"]

[tool.setuptools.package-data]
thelink = ["py.typed"]

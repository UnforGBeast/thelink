name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and its dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run the test suite
        run: python -m unittest discover tests/ -v

  installer-unix:
    name: installer from the web (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      LINK_REPO_URL: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
      LINK_INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.sh the way the README does, from a directory without a checkout
        run: |
          cp "$GITHUB_WORKSPACE/install.sh" "$RUNNER_TEMP/install.sh"
          cd "$RUNNER_TEMP"
          bash install.sh
      - name: Verify the link command
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          link --version
          link --help

  installer-windows-web:
    name: installer from the web (windows)
    runs-on: windows-latest
    env:
      LINK_REPO_URL: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
      LINK_INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.ps1 the way the README does (piped into iex, no checkout in the current directory)
        shell: pwsh
        run: |
          $script = Get-Content -Raw -Path (Join-Path $env:GITHUB_WORKSPACE "install.ps1")
          Set-Location $env:RUNNER_TEMP
          Invoke-Expression $script
      - name: Verify the link command
        shell: pwsh
        run: |
          $env:PATH = (Join-Path $env:USERPROFILE ".local\bin") + ";" + (Join-Path $env:LOCALAPPDATA "pipx\venvs\the-link\Scripts") + ";" + $env:PATH
          link --version
          link --help
